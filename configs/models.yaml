# Model registry. Model IDs are PINNED — never use an auto-routing / "random free"
# endpoint, because the served model could change between calls (D-02).

models:
  - key: llama31-8b
    provider: openrouter
    model_id: "meta-llama/llama-3.1-8b-instruct"
    family: llama
    enabled: true
    supports_json_schema: false
    notes: "Model family 1. Cheap, widely available, stable pinned ID."

  - key: qwen25-7b
    provider: openrouter
    model_id: "qwen/qwen-2.5-7b-instruct"
    family: qwen
    enabled: true
    supports_json_schema: false
    notes: "Model family 2, for the cross-family replication question (RQ5)."

  - key: gemini-31-flash-lite
    provider: gemini
    model_id: "gemini-3.1-flash-lite"
    family: gemini
    enabled: true
    supports_json_schema: true
    rate_limit_rpm: 25
    notes: >
      Model family 3, added mid-sprint on the Google free tier. The ID is pinned
      to an explicit version: `gemini-flash-latest` is an ALIAS that resolved to
      gemini-3.7-flash during testing and could change between calls, which D-02
      forbids. gemini-2.0-flash and 2.0-flash-lite are retired and return 404.
      This model emits 0 thinking tokens by default, keeping it comparable to the
      two non-reasoning open-weight models; gemini-3.7-flash spent 34 thinking
      tokens on a trivial choice and truncated its answer at our token budget.
      Throttled to 25 rpm for the free tier; 429s are retried with backoff.

  - key: llama32-3b-local
    provider: ollama
    model_id: "llama3.2:3b"
    family: llama
    enabled: false
    supports_json_schema: true
    notes: "Local fallback if no paid API access is available."

  # Deterministic offline provider. Used ONLY for tests and pipeline validation.
  # Any results produced with this model are SYNTHETIC and must never be reported
  # as an empirical finding (D-12).
  - key: mock
    provider: mock
    model_id: "mock-deterministic-v1"
    family: mock
    enabled: false
    supports_json_schema: true
    notes: "Offline pipeline self-test only. NOT a real model."
